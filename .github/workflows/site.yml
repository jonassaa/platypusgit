name: Deploy site

on:
  push:
    branches: [main]
    # `scripts/install-pgit.*` are here because the build COPIES them into
    # site/public/ (site/scripts/copy-installers.mjs) and the download page
    # tells people to pipe those URLs into a shell. Without this path, editing
    # an installer would leave the served copy stale until some unrelated
    # site/** change happened to redeploy it.
    paths:
      - 'site/**'
      - 'scripts/install-pgit.sh'
      - 'scripts/install-pgit.ps1'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Build
        run: pnpm build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
