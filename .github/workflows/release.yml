name: release

# Releases are cut by PUBLISHING a GitHub Release: draft it in the UI, pick the
# vX.Y.Z tag (GitHub creates the tag on publish), then publish when you're sure
# it's good. Publishing triggers this workflow, which builds per-platform bundles
# and attaches them to that same release:
#   - macOS  universal .dmg   (PlatypusGit_universal.dmg)
#   - Windows x64 .msi         (PlatypusGit_x64.msi)
#   - Linux  amd64 .deb + .AppImage (PlatypusGit_amd64.deb / .AppImage)
#
# Nothing releases on a plain push to main — you control when "latest" moves by
# choosing when to publish. Mark a release as a "prerelease" to build + attach
# assets WITHOUT moving Homebrew's releases/latest pointer; flip prerelease off
# later to promote it to latest (no rebuild needed).
#
# PROMOTING A PRERELEASE TAKES TWO STEPS, and the second is not optional
# (measured on v0.0.15). `gh release edit vX.Y.Z --prerelease=false` clears the
# flag but does NOT move releases/latest: a release CREATED as a prerelease
# cannot hold GitHub's `make_latest`, and clearing `prerelease` does not grant
# it. Skip the second step and brew plus the in-app updater go on serving the
# PREVIOUS version while the UI shows the new one as current. Follow it with
#   gh api -X PATCH repos/jonassaa/platypusgit/releases/<id> -f make_latest=true
# and then confirm the pointer actually moved:
#   gh api repos/jonassaa/platypusgit/releases/latest --jq .tag_name
#
# `bump-cask` and `updater-manifest` are gated on prerelease == false (see their
# `if:`), so a prerelease attaches the four bundles but touches NEITHER the
# Homebrew cask NOR latest.json. Verifying the cask BEFORE promoting therefore
# means running this workflow by workflow_dispatch against the tag while it is
# still a prerelease — accepting that the cask then points at the new version
# for as long as you wait before flipping the flag.
#
# Version is taken from the release tag (v0.0.4 -> 0.0.4) and injected into the
# app manifests at build time. The .dmg is published under a STABLE filename so
# the Homebrew cask can track releases/latest/download.
#
# The app is ad-hoc signed (tauri.conf.json -> macOS.signingIdentity "-") but
# NOT notarized — the Homebrew cask strips the Gatekeeper quarantine flag.

on:
  release:
    # A non-prerelease publish fires BOTH `published` and `released`, so we
    # subscribe to both but gate the `version` job (below) to run only on
    # `published` — that dedups the two events into a single build+bump run.
    # `released` still starts a run, but every job skips (all chain off
    # `version`), so a direct full-release publish builds exactly once.
    #
    # Promoting a prerelease to a full release later fires `released` only
    # (not `published`); under this gate that run is a no-op, so promotion
    # does NOT auto-bump the cask — bump it with a `workflow_dispatch` against
    # the tag (see the bump-cask job).
    types: [published, released]
  workflow_dispatch: # re-run a build against an existing release tag
    inputs:
      tag:
        description: 'Existing release tag to (re)build, e.g. v0.0.4'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Skip the redundant `released` run on a direct full-release publish (which
    # also fires `published`). Every other job chains off `version`, so this one
    # gate collapses the double-trigger into a single build+bump.
    #
    # ⚠️ RUNBOOK — PROMOTING A PRERELEASE BREAKS SELF-UPDATE UNTIL YOU ACT.
    # Flipping "prerelease" off on an existing release fires `released` ONLY
    # (never `published`), so this gate makes the whole workflow a no-op:
    # `latest.json` is never attached for that tag. Meanwhile GitHub's
    # /releases/latest immediately starts returning it, so every installed
    # client discovers the new version and the updater then fetches
    #   releases/latest/download/latest.json  ->  404.
    # Self-update is offered and fails for as long as that state lasts.
    # FIX: after promoting, re-run this workflow via workflow_dispatch with the
    # tag (that also bumps the Homebrew cask, which has the same gap).
    # Do not "fix" this by widening the gate — `released` + `published` both
    # fire on a direct publish and would double-build.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.action == 'published' }}
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve version from release tag
        id: resolve
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name || inputs.tag }}"
          if [ -z "$tag" ]; then
            echo "No release tag available" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "Tag: $tag  Version: $version"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  macos-universal:
    needs: version
    runs-on: macos-14
    outputs:
      sha256: ${{ steps.sha.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inject version ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          tmp="$(mktemp)"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          jq --arg v "$v" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json
          sed -i '' -E "s/^version = \".*\"/version = \"$v\"/" src-tauri/Cargo.toml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build universal app
        # The signing key is required even though macOS never self-updates
        # (`capability()` returns Notify for it, and latest.json carries only the
        # windows and linux entries): `bundle.createUpdaterArtifacts` is global,
        # so the bundler still produces an updater artifact here — and a pubkey
        # with no private key is a hard error, not a skip. Without this the job
        # fails, no dmg is attached, and bump-cask (which needs it) never runs.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Rename dmg to stable name
        run: |
          set -euo pipefail
          src_dir="src-tauri/target/universal-apple-darwin/release/bundle/dmg"
          dmg="$(ls "$src_dir"/*.dmg | head -n1)"
          cp "$dmg" "$src_dir/PlatypusGit_universal.dmg"

      - name: Compute .dmg sha256
        id: sha
        run: |
          set -euo pipefail
          f="src-tauri/target/universal-apple-darwin/release/bundle/dmg/PlatypusGit_universal.dmg"
          sum="$(shasum -a 256 "$f" | awk '{print $1}')"
          echo "sha256: $sum"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"

      - name: Attach .dmg to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/PlatypusGit_universal.dmg
          fail_on_unmatched_files: true

  windows:
    needs: version
    runs-on: windows-latest
    outputs:
      msi_sig: ${{ steps.sig.outputs.msi_sig }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inject version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          tmp="$(mktemp)"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          jq --arg v "$v" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json
          sed -i -E "s/^version = \".*\"/version = \"$v\"/" src-tauri/Cargo.toml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Rename bundle to stable name
        shell: bash
        run: |
          set -euo pipefail
          msi_dir="src-tauri/target/release/bundle/msi"
          cp "$(ls "$msi_dir"/*.msi | head -n1)" "$msi_dir/PlatypusGit_x64.msi"

      # Attach BEFORE reading the signature. Under `set -euo pipefail` a glob
      # miss in the sig step aborts the job, and when that step ran first the
      # release ended up with no installer attached at all.
      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: src-tauri/target/release/bundle/msi/PlatypusGit_x64.msi
          fail_on_unmatched_files: true

      - name: Read updater signature
        id: sig
        shell: bash
        run: |
          set -euo pipefail
          msi_dir="src-tauri/target/release/bundle/msi"
          sig_file="$(ls "$msi_dir"/*.msi.sig 2>/dev/null | head -n1 || true)"
          if [ -z "$sig_file" ] || [ ! -f "$sig_file" ]; then
            echo "No .msi.sig produced — is TAURI_SIGNING_PRIVATE_KEY set?" >&2
            exit 1
          fi
          sig="$(cat "$sig_file")"
          if [ -z "$sig" ]; then
            echo "Updater signature file $sig_file is empty" >&2
            exit 1
          fi
          echo "msi_sig=$sig" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-22.04
    outputs:
      appimage_sig: ${{ steps.sig.outputs.appimage_sig }}
      deb_sig: ${{ steps.sig.outputs.deb_sig }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install system deps
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inject version ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          tmp="$(mktemp)"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > "$tmp" && mv "$tmp" src-tauri/tauri.conf.json
          jq --arg v "$v" '.version = $v' package.json > "$tmp" && mv "$tmp" package.json
          sed -i -E "s/^version = \".*\"/version = \"$v\"/" src-tauri/Cargo.toml

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Rename bundles to stable names
        run: |
          set -euo pipefail
          deb_dir="src-tauri/target/release/bundle/deb"
          appimage_dir="src-tauri/target/release/bundle/appimage"
          cp "$(ls "$deb_dir"/*.deb | head -n1)" "$deb_dir/PlatypusGit_amd64.deb"
          cp "$(ls "$appimage_dir"/*.AppImage | head -n1)" "$appimage_dir/PlatypusGit_amd64.AppImage"

      # Attach BEFORE reading the signature — see the windows job for why.
      - name: Attach bundles to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            src-tauri/target/release/bundle/deb/PlatypusGit_amd64.deb
            src-tauri/target/release/bundle/appimage/PlatypusGit_amd64.AppImage
          fail_on_unmatched_files: true

      # BOTH Linux bundles are updater artifacts, so both get a signature.
      # tauri-cli's `sign_updaters` has covered Deb (and Rpm) alongside
      # AppImage/msi/nsis since 2.10 — the .deb.sig has therefore been produced
      # on every release build already; we just never read it, which is why
      # latest.json had no `linux-x86_64-deb` entry.
      #
      # minisign signs CONTENT, not filenames, so the stable-name `cp` above
      # leaves both signatures valid for the renamed copies we attach.
      - name: Read updater signatures
        id: sig
        run: |
          set -euo pipefail
          # Called directly (never in a $(...) subshell) so `exit 1` aborts the
          # job rather than just the substitution.
          emit() {
            name="$1"; dir="$2"; pattern="$3"
            file="$(ls "$dir"/$pattern 2>/dev/null | head -n1 || true)"
            if [ -z "$file" ] || [ ! -f "$file" ]; then
              echo "No $pattern produced in $dir — is TAURI_SIGNING_PRIVATE_KEY set?" >&2
              exit 1
            fi
            sig="$(cat "$file")"
            if [ -z "$sig" ]; then
              echo "Updater signature file $file is empty" >&2
              exit 1
            fi
            echo "$name=$sig" >> "$GITHUB_OUTPUT"
          }
          emit appimage_sig src-tauri/target/release/bundle/appimage '*.AppImage.sig'
          emit deb_sig      src-tauri/target/release/bundle/deb      '*.deb.sig'

  # Pin the Homebrew cask to this release: rewrite version + sha256 in
  # jonassaa/homebrew-platypusgit and commit straight to that tap's main.
  #
  # Runs on: (a) a non-prerelease `published` release, and (b) a manual
  # workflow_dispatch against an explicit tag. Plain prereleases are skipped
  # so "brew install" never jumps to an unfinished build. Because `version`
  # is gated to `published`/dispatch, this job never runs on a `released`
  # event — so promoting a prerelease to a full release does NOT auto-bump;
  # bump that tag with a workflow_dispatch on demand. Requires the macOS
  # build's sha256 output (needs: macos-universal).
  #
  # Cross-repo push: GITHUB_TOKEN can't reach the tap, so we mint a short-lived
  # token from a GitHub App installed on the tap (app id in vars.TAP_APP_ID,
  # private key in secrets.TAP_APP_PRIVATE_KEY). The commit is attributed to
  # github-actions[bot].
  bump-cask:
    needs: [version, macos-universal]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Mint tap token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: jonassaa
          repositories: homebrew-platypusgit

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: jonassaa/homebrew-platypusgit
          token: ${{ steps.app-token.outputs.token }}
          path: tap

      - name: Rewrite cask version + sha256
        run: |
          set -euo pipefail
          v="${{ needs.version.outputs.version }}"
          sha="${{ needs.macos-universal.outputs.sha256 }}"
          if [ -z "$sha" ]; then
            echo "Empty sha256 from macos-universal job" >&2
            exit 1
          fi
          f="tap/Casks/platypusgit.rb"
          sed -i -E "s/^  version \".*\"/  version \"$v\"/" "$f"
          sed -i -E "s/^  sha256 \".*\"/  sha256 \"$sha\"/" "$f"
          echo "--- updated cask ---"
          grep -E '^  (version|sha256|url)' "$f"

      - name: Commit & push to tap main
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Cask already up to date — nothing to commit"
            exit 0
          fi
          git add Casks/platypusgit.rb
          git commit -m "chore: bump platypusgit to ${{ needs.version.outputs.version }}"
          git push

  # Publish the updater manifest so tauri-plugin-updater can verify + install.
  # Points at the stable-named release assets. macOS is intentionally omitted
  # (notify-only). Skipped for plain prereleases, same gate as bump-cask.
  #
  # KEY LAYOUT. The plugin builds its lookup key as `{os}-{arch}-{installer}`
  # and searches [`{os}-{arch}-{installer}`, `{os}-{arch}`] in that order, where
  # `installer` comes from the bundle type patched into the binary at bundle
  # time (deb / rpm / appimage / nsis / msi / app). So we publish BOTH:
  #
  #   - bundle-specific keys, which is what any current client actually matches.
  #     Without `linux-x86_64-deb` a .deb install falls through to the generic
  #     `linux-x86_64` key and is handed an *AppImage* as its payload.
  #   - the generic `{os}-{arch}` keys, for pre-2.10 clients that don't compute
  #     an installer suffix at all.
  #
  # The generic Linux key can safely stay pointed at the AppImage: every client
  # old enough to only look there is necessarily an AppImage install, because
  # `update::capability` has always gated Linux self-update behind the APPIMAGE
  # env var (a .deb install gets `notify` and never invokes the plugin). Same
  # reasoning for `windows-x86_64` -> msi, the only Windows bundle we ship.
  updater-manifest:
    needs: [version, windows, linux]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Build latest.json
        # Values reach the shell as env vars, never as `${{ }}` interpolated
        # into the script body — RELEASE_BODY is user-authored text.
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          MSI_SIG: ${{ needs.windows.outputs.msi_sig }}
          APPIMAGE_SIG: ${{ needs.linux.outputs.appimage_sig }}
          DEB_SIG: ${{ needs.linux.outputs.deb_sig }}
          RELEASE_BODY: ${{ github.event.release.body }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          # An empty signature publishes `"signature": ""`, which every client
          # rejects at install time — fail loudly instead (same guard shape as
          # bump-cask's sha256 check).
          for name in MSI_SIG APPIMAGE_SIG DEB_SIG; do
            if [ -z "${!name}" ]; then
              echo "Empty updater signature ($name) — refusing to publish latest.json" >&2
              exit 1
            fi
          done
          base="https://github.com/jonassaa/platypusgit/releases/download/${TAG}"
          # Real release notes; fall back to a link for workflow_dispatch runs
          # (no release payload) or an empty body.
          notes="${RELEASE_BODY}"
          if [ -z "$notes" ]; then
            notes="See https://github.com/jonassaa/platypusgit/releases/tag/${TAG}"
          fi
          # pub_date must be RFC3339. The release's own published_at already is;
          # workflow_dispatch has none, so stamp "now".
          pub_date="${RELEASE_PUBLISHED_AT}"
          if [ -z "$pub_date" ]; then
            pub_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          jq -n \
            --arg version "$VERSION" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg msi_sig "$MSI_SIG" \
            --arg msi_url "${base}/PlatypusGit_x64.msi" \
            --arg appimage_sig "$APPIMAGE_SIG" \
            --arg appimage_url "${base}/PlatypusGit_amd64.AppImage" \
            --arg deb_sig "$DEB_SIG" \
            --arg deb_url "${base}/PlatypusGit_amd64.deb" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64":        { signature: $msi_sig,      url: $msi_url },
                "windows-x86_64-msi":    { signature: $msi_sig,      url: $msi_url },
                "linux-x86_64":          { signature: $appimage_sig, url: $appimage_url },
                "linux-x86_64-appimage": { signature: $appimage_sig, url: $appimage_url },
                "linux-x86_64-deb":      { signature: $deb_sig,      url: $deb_url }
              }
            }' > latest.json
          echo "--- latest.json ---"
          cat latest.json

      - name: Attach latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: latest.json
          fail_on_unmatched_files: true

  # Publish this release's .deb into the APT repository (#187), so Linux users
  # install in one line and upgrade with `apt upgrade` instead of re-downloading
  # from a browser.
  #
  # Same shape as bump-cask: mint a token from the GitHub App, check out the
  # other repo, rewrite, push. The gate expression is COPIED from bump-cask, not
  # retyped — a typo here does not bump a formula, it pushes a prerelease into a
  # signed index that every installed client discovers on its next `apt update`.
  #
  # The repository is its own repo + GitHub Pages (jonassaa/apt-platypusgit,
  # served at apt.platypusgit.com) because it CANNOT live in the marketing site:
  # site.yml uploads site/dist as the whole Pages artifact, so every site deploy
  # would delete a pool this job had pushed in. It holds no workflows and no
  # code — Pages serves it straight off the branch.
  #
  # `vars.TAP_APP_ID` / `secrets.TAP_APP_PRIVATE_KEY` now cover TWO repos: the
  # Homebrew tap and this one. The names are stale on purpose — renaming a live
  # secret is a manual settings step whose only failure mode is a broken release.
  # The App must be installed on apt-platypusgit with contents: write.
  #
  # NOTHING is pushed until a real `apt-get install` succeeds in a container
  # (see the gate step). That is deliberate: this install path is the first
  # thing a new Linux user touches, and a broken index is discovered by users on
  # their next `apt update` rather than by us.
  apt-publish:
    needs: [version, linux]
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'release' && github.event.release.prerelease == false) || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      # apt-ftparchive. Present on the runner images today; installed explicitly
      # so a base-image change fails this step with a clear message instead of
      # failing the publish script halfway through.
      - name: Install apt-utils
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils

      - name: Mint apt repo token from GitHub App
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.TAP_APP_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: jonassaa
          repositories: apt-platypusgit

      - name: Checkout the apt repository
        uses: actions/checkout@v4
        with:
          repository: jonassaa/apt-platypusgit
          token: ${{ steps.app-token.outputs.token }}
          path: apt

      # The same asset users download, rather than a job artifact — so what
      # lands in the pool is provably the published bundle, and a
      # workflow_dispatch against an existing tag works identically.
      - name: Download the release .deb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$TAG" \
            --repo jonassaa/platypusgit \
            --pattern PlatypusGit_amd64.deb \
            --clobber
          ls -la PlatypusGit_amd64.deb

      - name: Build + sign the index
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # An unset signing key would otherwise fall through to "no secret key
          # available to sign with" deep inside the script. Same guard shape as
          # bump-cask's sha256 check and updater-manifest's signature check.
          if [ -z "${APT_GPG_PRIVATE_KEY}" ]; then
            echo "APT_GPG_PRIVATE_KEY is empty — refusing to publish an unsigned repository" >&2
            exit 1
          fi
          scripts/apt-repo-publish.sh \
            --repo apt \
            --deb PlatypusGit_amd64.deb \
            --version "$VERSION"

      # THE GATE. A real `apt-get install` from this exact index, in a clean
      # debian:bookworm, running the same installer the download page tells
      # people to pipe into a shell.
      #
      # --expect-git additionally asserts Depends: git resolved and that
      # Provides:/Section: landed in the control data. A workflow_dispatch
      # against a tag built BEFORE those keys existed will fail here, by design:
      # such a package installs without git and breaks at runtime, so it should
      # not reach the repository.
      - name: Gate — install it in a container before publishing
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/apt-repo-smoke.sh \
            --repo apt \
            --version "$VERSION" \
            --installer scripts/install-platypusgit.sh \
            --expect-git

      - name: Commit & push to the apt repository
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd apt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -A, not a path list: publishing both adds a pool file and REMOVES the
          # ones pruned past the retention cap.
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already up to date — nothing to commit"
            exit 0
          fi
          git commit -m "chore: publish platypusgit ${VERSION}"
          git push

  # Confirm the LIVE host actually serves what we just pushed. The gate above
  # cannot see any of this: DNS, the Pages build, HTTPS, propagation.
  #
  # GitHub Pages publishes asynchronously after a push, so the smoke script's
  # readiness loop doubles as the retry — hence the long --wait rather than a
  # sleep. A failure here means users cannot install even though the index is
  # correct, which is worth failing the run for.
  apt-verify-live:
    needs: [version, apt-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install from apt.platypusgit.com
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          scripts/apt-repo-smoke.sh \
            --url https://apt.platypusgit.com \
            --version "$VERSION" \
            --installer scripts/install-platypusgit.sh \
            --expect-git \
            --wait 900
