name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for every job below (#345). Nothing in this file touches
# GITHUB_TOKEN or `gh`: the change filter diffs locally after a full-depth
# checkout, and upload/download-artifact authenticate with the Actions runtime
# token, not this one. Declared explicitly so the scope is documented here
# rather than inherited from a repository setting that can change under it.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of the two suites a change can possibly affect.
  #
  # Unlike the E2E filter — which rebuilds the whole binary and so has to care
  # about src/, src-tauri/ and e2e/ together, under a single `app` output —
  # these two suites have DISJOINT inputs, so they get an output each and skip
  # independently:
  #   * `js`   vitest + both typechecks. Read src/, e2e/ and the JS build
  #            config. No amount of Rust can change their result.
  #   * `rust` cargo test. Reads src-tauri/ only. It never compiles the
  #            frontend: asset embedding is behind the `custom-protocol`
  #            feature, so tauri-build is happy with no dist/ present.
  #
  # The filter runs for pull_request events only. On push and workflow_dispatch
  # there is no reliable diff base, so both outputs fall back to 'true' (a
  # skipped step has no outputs, and the `||` picks up the empty string) and
  # both suites run — main is never left untested.
  changes:
    runs-on: ubuntu-latest
    outputs:
      js: ${{ steps.filter.outputs.js || 'true' }}
      rust: ${{ steps.filter.outputs.rust || 'true' }}
      msix: ${{ steps.filter.outputs.msix || 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # e2e/ counts as frontend input because `tsc -p e2e/tsconfig.json`
          # runs in the unit job — the root tsconfig excludes e2e/, so nothing
          # else typechecks the specs.
          #
          # The last seven entries are the INPUTS the `docs` vitest project
          # reads, not frontend sources, and each one was skippable by exactly
          # the change it exists to police: `test/` holds both suites,
          # `docs.test.ts` asserts CLAUDE.md + docs/dev/ match the tree,
          # `shardSpecs.test.ts` asserts e2e.yml's shard matrix covers every
          # spec, `comparison.test.ts` asserts README.md's comparison table
          # matches site/src/data/comparison.json, and `contributing.test.ts`
          # asserts CONTRIBUTING.md's links and commands still exist (#211).
          # Without them here, editing only the docs, only the matrix, or only
          # the table skipped its own guard and reported green (issue 189, then
          # #210 — a README-only PR ran no suite at all).
          #
          # `scripts/` is here for the same reason: `pruneCaches.test.ts`
          # imports `scripts/prune-actions-caches.mjs` and pins which caches it
          # is allowed to DELETE. Without this line, editing the pruner alone
          # would skip the only suite that checks it — and the failure mode is
          # deleting the cache of the release currently building.
          #
          # `src-tauri/icons/msix/` is the newest entry and the same story
          # (#390): `msixIcons.test.ts` decodes those PNGs and fails if one has
          # an opaque corner. Re-rendering the ladder is the ONLY change that
          # can break it, and without this it is the one change that would not
          # run it.
          if echo "$changed" | grep -qE '^(src/|e2e/|test/|scripts/|src-tauri/icons/msix/|index\.html$|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|tsconfig[a-z.]*\.json$|CLAUDE\.md$|README\.md$|CONTRIBUTING\.md$|docs/dev/|site/src/data/comparison\.json$|\.github/workflows/(tests|e2e)\.yml$)'; then
            echo "js=true" >> "$GITHUB_OUTPUT"
            echo "-> frontend sources touched, running the unit suite"
          else
            echo "js=false" >> "$GITHUB_OUTPUT"
            echo "-> no frontend sources touched, skipping the unit suite"
          fi

          if echo "$changed" | grep -qE '^(src-tauri/|\.github/workflows/tests\.yml$)'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "-> backend sources touched, running the Rust suite"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "-> no backend sources touched, skipping the Rust suite"
          fi

          # The Store packaging inputs. This gate exists because THREE bugs in it
          # reached a published release and could only be found on a Windows
          # runner: makeappx not being on PATH, then Git Bash rewriting `/d`
          # into `D:/`, then the missing unplated icons and resource index that
          # put a blue plate behind the taskbar icon (#390). None is reachable
          # from a Mac or from the unit suites, so nothing before the release
          # job could see them.
          #
          # `src-tauri/icons/` is in the list as a WHOLE directory, not just the
          # `msix/` ladder, and that breadth is the point: the package ships the
          # base tile logos from it too, and re-rendering the icon set is
          # precisely the change that drops one. Listing only the files this
          # gate happened to break would leave it skippable by the next
          # `tauri icon` run — the failure mode the paragraph above the js
          # filter describes, three times over.
          if echo "$changed" | grep -qE '^(src-tauri/windows/Package\.appxmanifest$|src-tauri/tauri\.msstore\.conf\.json$|src-tauri/icons/|scripts/msix-pack\.sh$|scripts/gen-msix-appicons\.sh$|\.github/workflows/(release|tests)\.yml$)'; then
            echo "msix=true" >> "$GITHUB_OUTPUT"
            echo "-> Store packaging touched, running the msix pack gate"
          else
            echo "msix=false" >> "$GITHUB_OUTPUT"
            echo "-> Store packaging untouched, skipping the msix pack gate"
          fi

  # Frontend: both typechecks plus the vitest unit + component tests. Pure
  # Node/jsdom — no Tauri system deps, no webview, no Rust toolchain.
  unit:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Typecheck src
        run: pnpm tsc --noEmit

      - name: Unit and component tests
        run: pnpm test

      # Separate command on purpose: the root tsconfig has `"exclude": ["e2e"]`,
      # so the step above never sees the specs. This is the only place they are
      # compiled anywhere in CI.
      - name: Typecheck e2e specs
        run: pnpm exec tsc -p e2e/tsconfig.json --noEmit

  # Backend: the libgit2 integration suite in src-tauri/tests/, which drives
  # every GitBackend op against real temp repos.
  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # Same package list e2e.yml installs, minus xvfb: linking the crate pulls
      # in the real Tauri stack, so the -dev packages are needed at BUILD time,
      # but the tests themselves are headless (libgit2 against temp repos, no
      # window, no network) and never need an X server at RUNTIME.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Several fixtures shell out to real `git` (rebase, clone, submodules,
      # LFS). A bare runner has no committer identity, so those calls would
      # fail with "Please tell me who you are" before reaching any assertion.
      - name: Configure git for fixtures
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@platypusgit.test"
          git config --global init.defaultBranch main

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # The two gate jobs below are the ones worth adding to the branch ruleset as
  # required checks. They always run and always report, so a PR that legitimately
  # skipped a suite is not left waiting forever on a check that never arrives —
  # the trap that makes a path-filtered required check block a PR permanently.
  # Equally, they fail rather than pass when a suite was skipped for any reason
  # OTHER than the filter clearing it, so a green tick always means the suite
  # either ran or could not have been affected.
  unit-tests:
    needs: [changes, unit]
    if: always()
    runs-on: ubuntu-latest
    # No checkout and no token use: this gate only reads `needs.*.result`.
    permissions: {}
    steps:
      - name: Gate on the unit result
        env:
          FILTER: ${{ needs.changes.result }}
          TOUCHED: ${{ needs.changes.outputs.js }}
          RESULT: ${{ needs.unit.result }}
        run: |
          echo "filter job: $FILTER / frontend touched: $TOUCHED / unit job: $RESULT"
          # A failed filter job skips `unit` too. Without this check the gate
          # would read that skip as "not required" and pass a PR whose suite
          # never ran at all.
          if [ "$FILTER" != "success" ]; then
            echo "The change-filter job did not succeed, so the suite never ran."
            exit 1
          fi
          case "$RESULT" in
            success) echo "Unit suite passed." ;;
            skipped)
              # Only legitimate when the filter decided no frontend code was touched.
              if [ "$TOUCHED" != "false" ]; then
                echo "Unit suite was skipped even though frontend code changed."
                exit 1
              fi
              echo "No frontend code touched — unit suite not required for this change."
              ;;
            *) echo "Unit suite did not pass."; exit 1 ;;
          esac

  rust-tests:
    needs: [changes, rust]
    if: always()
    runs-on: ubuntu-latest
    # No checkout and no token use: this gate only reads `needs.*.result`.
    permissions: {}
    steps:
      - name: Gate on the Rust result
        env:
          FILTER: ${{ needs.changes.result }}
          TOUCHED: ${{ needs.changes.outputs.rust }}
          RESULT: ${{ needs.rust.result }}
        run: |
          echo "filter job: $FILTER / backend touched: $TOUCHED / rust job: $RESULT"
          if [ "$FILTER" != "success" ]; then
            echo "The change-filter job did not succeed, so the suite never ran."
            exit 1
          fi
          case "$RESULT" in
            success) echo "Rust suite passed." ;;
            skipped)
              # Only legitimate when the filter decided no backend code was touched.
              if [ "$TOUCHED" != "false" ]; then
                echo "Rust suite was skipped even though backend code changed."
                exit 1
              fi
              echo "No backend code touched — Rust suite not required for this change."
              ;;
            *) echo "Rust suite did not pass."; exit 1 ;;
          esac

  # Prove the Store package can actually be BUILT, on a PR rather than on a
  # release.
  #
  # Why this exists: two bugs in this path reached a published release, and
  # neither was reachable from a Mac or from any other suite here — makeappx was
  # not on PATH, and then Git Bash rewrote `/d` into `D:/` so every flag arrived
  # corrupted. Both are Windows-runner-only, and both cost a 20-minute release
  # cycle to discover.
  #
  # Why it does NOT build the app: the bugs are in the PACKAGING, not the binary,
  # so any valid PE proves the same thing. Copying a system executable makes this
  # a one-minute job instead of a Rust release build, which is what keeps it
  # affordable on every PR that touches these three files. It deliberately does
  # not sign, submit, or upload anything.
  msix-pack:
    needs: changes
    if: ${{ needs.changes.outputs.msix == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Kept byte-identical to release.yml's step of the same name, deliberately:
      # this job exists to fail here instead of at release time, which it can
      # only do while the two agree. `makepri.exe` is demanded alongside
      # `makeappx.exe` because msix-pack.sh needs both — see the resource-index
      # step in that script.
      - name: Put the Windows SDK's makeappx and makepri on PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = 'C:\Program Files (x86)\Windows Kits\10\bin'
          if (-not (Test-Path $root)) { throw "no Windows 10 SDK at $root" }
          $sdk = Get-ChildItem $root -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
              Where-Object {
                  $x64 = Join-Path $_.FullName 'x64'
                  (Test-Path (Join-Path $x64 'makeappx.exe')) -and
                  (Test-Path (Join-Path $x64 'makepri.exe'))
              } |
              Sort-Object { [version]$_.Name } -Descending |
              Select-Object -First 1
          if (-not $sdk) {
              throw "no SDK version in $root has both x64\makeappx.exe and x64\makepri.exe"
          }
          $bin = Join-Path $sdk.FullName 'x64'
          Write-Host "makeappx + makepri found in: $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # A real PE, because makeappx validates the Executable it is pointed at.
      # `where.exe` is tiny and always present; nothing here runs it.
      - name: Stand in a real executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path stand-in | Out-Null
          Copy-Item C:\Windows\System32\where.exe stand-in\platypusgit.exe

      # Deliberately runs under `shell: bash` — Git Bash — because that is the
      # shell the release uses and the one whose argument rewriting broke it.
      # Running this under pwsh would pass while the release still failed.
      - name: Pack, the same way the release does
        shell: bash
        env:
          MSIX_IDENTITY_NAME: GateCheck.platypusgit
          MSIX_PUBLISHER: CN=00000000-0000-0000-0000-000000000000
        run: |
          set -euo pipefail
          sh scripts/msix-pack.sh --version 9.9.9 --arch x64 \
            --exe stand-in/platypusgit.exe --out msix-gate

      - name: Gate — a package exists and carries what it must
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'msix-gate.msix')) { throw 'no .msix was produced' }
          Expand-Archive -Path 'msix-gate.msix' -DestinationPath 'msix-gate-check' -Force
          foreach ($f in 'platypusgit.exe', 'pgit.cmd', 'AppxManifest.xml', 'resources.pri') {
              if (-not (Test-Path (Join-Path 'msix-gate-check' $f))) {
                  throw "packed .msix has no $f at its root"
              }
          }
          # The unplated app-list icons and the index that makes them findable
          # (#390). Checked HERE and not only in release.yml because this is the
          # gate that runs on the PR that breaks them: the defect is invisible
          # in a package that installs, launches and certifies, and shows up
          # only as an accent-coloured plate behind the icon on a user's
          # taskbar. Both ends of the ladder, so a half-rendered set cannot pass.
          foreach ($n in 16, 256) {
              foreach ($form in '', '_altform-unplated', '_altform-lightunplated') {
                  $asset = "msix-gate-check\Assets\Square44x44Logo.targetsize-$n$form.png"
                  if (-not (Test-Path $asset)) {
                      throw "packed .msix is missing $asset — the taskbar icon would get a coloured plate"
                  }
              }
          }
          $manifest = Get-Content 'msix-gate-check\AppxManifest.xml' -Raw
          if ($manifest -match '__MSIX_') { throw 'packed manifest carries an unsubstituted token' }
          if ($manifest -notmatch 'Alias="pgit\.exe"') { throw 'packed manifest lost the pgit alias' }
          if ($manifest -notmatch 'Version="9\.9\.9\.0"') { throw 'packed manifest has the wrong version' }
          Write-Host 'msix pack gate OK'
